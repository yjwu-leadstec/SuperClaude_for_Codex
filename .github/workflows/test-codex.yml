name: Test SuperClaude for Codex

on:
  push:
    paths:
      - 'src/superclaude_codex/**'
      - 'tests/superclaude_codex/**'
      - 'tests/golden/**'
      - 'pyproject-codex.toml'
  pull_request:
    paths:
      - 'src/superclaude_codex/**'
      - 'tests/superclaude_codex/**'
      - 'tests/golden/**'
      - 'pyproject-codex.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cp pyproject-codex.toml pyproject.toml.bak
          cp pyproject-codex.toml pyproject.toml
          uv pip install -e ".[dev]" --system
          mv pyproject.toml.bak pyproject.toml

      - name: Lint
        run: uv run ruff check src/superclaude_codex/

      - name: Run tests
        run: uv run pytest tests/superclaude_codex/ tests/golden/ -v --tb=short

      - name: Import guard
        run: |
          ! grep -rn "from superclaude\b\|import superclaude\b" src/superclaude_codex/ \
            || (echo "ERROR: old superclaude imports found" && exit 1)

      - name: CLI smoke test
        run: |
          superclaude-codex --version
          superclaude-codex commands list
          superclaude-codex commands validate

  install-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel
        run: |
          cp pyproject-codex.toml pyproject.toml
          uv build
          mv pyproject.toml pyproject-codex.toml

      - name: Install from wheel
        run: |
          uv pip install dist/*.whl --system

      - name: Smoke test install
        run: |
          tmpdir=$(mktemp -d)
          CODEX_HOME="$tmpdir/.codex" superclaude-codex install
          CODEX_HOME="$tmpdir/.codex" superclaude-codex doctor
          CODEX_HOME="$tmpdir/.codex" superclaude-codex commands validate
          rm -rf "$tmpdir"
