name: Test SuperClaude for Codex

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src/superclaude_codex/

      - name: Run tests
        run: uv run pytest tests/superclaude_codex/ tests/golden/ -v --tb=short

      - name: Import guard
        run: |
          ! grep -rn "from superclaude\b\|import superclaude\b" src/superclaude_codex/ \
            || (echo "ERROR: old superclaude imports found" && exit 1)

      - name: CLI smoke test
        run: |
          uv run superclaude-codex --version
          uv run superclaude-codex commands list
          uv run superclaude-codex commands validate

  install-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build and install
        run: |
          uv build
          uv pip install dist/*.whl --python $(uv python find 3.12)

      - name: Smoke test install
        run: |
          tmpdir=$(mktemp -d)
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex install
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex doctor
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex commands validate
          rm -rf "$tmpdir"
