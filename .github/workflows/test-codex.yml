name: Test SuperClaude for Codex

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src/superclaude_codex/ tests/

      - name: Format check
        run: uv run ruff format --check src/superclaude_codex/ tests/

      - name: Run tests
        run: uv run pytest tests/superclaude_codex/ tests/golden/ -v --tb=short

      - name: Import guard
        run: |
          ! grep -rn "from superclaude\b\|import superclaude\b" src/superclaude_codex/ \
            || (echo "ERROR: old superclaude imports found" && exit 1)

      - name: CLI smoke test
        run: |
          uv run superclaude-codex --version
          uv run superclaude-codex commands list
          uv run superclaude-codex commands validate

  install-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel
        run: |
          uv venv --python 3.12
          uv build

      - name: Install from wheel
        run: uv pip install dist/*.whl

      - name: Smoke test install
        run: |
          tmpdir=$(mktemp -d)
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex install
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex doctor
          CODEX_HOME="$tmpdir/.codex" uv run superclaude-codex commands validate
          rm -rf "$tmpdir"

  script-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Run install-codex.sh from clean state
        run: |
          rm -rf .venv
          tmpdir=$(mktemp -d)
          CODEX_HOME="$tmpdir/.codex" ./install-codex.sh
          test -f "$tmpdir/.codex/AGENTS.md"
          test -f "$tmpdir/.codex/superclaude-for-codex/commands.json"
          rm -rf "$tmpdir"
