schema_version: 1
id: task
display_name: /sc-task
category: project_management
description: Execute complex tasks with intelligent workflow management and delegation
aliases:
- /sc-task
- /sc:task
- sc-task
- sc:task
- task
triggers:
- Complex tasks requiring multi-agent coordination and delegation
- Projects needing structured workflow management and cross-session persistence
- Operations requiring intelligent MCP server routing and domain expertise
- Tasks benefiting from systematic execution and progressive enhancement
workflow:
- analyze
- delegate
- coordinate
- validate
- optimize
personas:
- system-architect
- analyzer
- frontend
- backend
- security
- devops
- project-manager
mcp:
  optional:
  - sequential-thinking
  - context7
  - magic
  - playwright
safety:
  writes_code: false
  writes_files: false
  requires_user_confirmation_for_scope_change: true
output_contract:
  primary: task_list
  required_sections:
  - tasks
  - priorities
  - assignments
codex:
  skill_name: superclaude-task
  default_reasoning: medium
  web_search: optional
inputs:
  positional:
  - name: action
    required: false
    description: Task action such as create, execute, update, or review.
  - name: target
    required: false
    description: Task, backlog, project, or feature target.
  flags:
  - name: strategy
    values:
    - systematic
    - agile
    - enterprise
    description: Task execution strategy.
  - name: parallel
    type: boolean
    description: Execute independent task work in parallel.
  - name: delegate
    type: boolean
    description: Delegate suitable subtasks to agents.
  examples:
  - /sc-task create "enterprise authentication system" --strategy systematic --parallel
