schema_version: 1
id: brainstorm
display_name: /sc:brainstorm
category: discovery
description: Interactive requirements discovery through Socratic dialogue and systematic exploration.

aliases:
  - /sc:brainstorm
  - sc:brainstorm
  - brainstorm

triggers:
  - user wants to explore an idea
  - user asks to brainstorm
  - user describes a product concept
  - ambiguous project ideas requiring structured exploration
  - requirements discovery and specification development

inputs:
  positional:
    - name: topic
      required: false
      description: The idea or topic to brainstorm about
  flags:
    - name: strategy
      values: [systematic, agile, enterprise]
      default: systematic
    - name: depth
      values: [shallow, normal, deep]
      default: normal

workflow:
  - understand_request
  - inspect_project_context
  - ask_targeted_questions
  - generate_alternatives
  - challenge_assumptions
  - produce_design_doc

personas:
  - analyst
  - product
  - architect

mcp:
  optional:
    - context7
    - tavily
    - sequential-thinking

safety:
  writes_code: false
  writes_files: true
  requires_user_confirmation_for_scope_change: true

output_contract:
  primary: design_doc
  required_sections:
    - problem_statement
    - constraints
    - approaches_considered
    - recommended_approach
    - next_steps

codex:
  skill_name: superclaude-brainstorm
  default_reasoning: medium
  web_search: optional
