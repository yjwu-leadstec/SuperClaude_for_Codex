schema_version: 1
id: implement
display_name: /sc-implement
category: development
description: Feature and code implementation with intelligent persona activation.
aliases:
- /sc-implement
- /sc:implement
- sc-implement
- sc:implement
- implement
triggers:
- user asks to implement a feature
- user wants to write code for a component
- feature development request
- code implementation need
inputs:
  positional:
  - name: feature_description
    required: false
    description: Feature, behavior, bug fix, or implementation request.
  flags:
  - name: type
    values:
    - component
    - api
    - service
    - feature
    description: Implementation target type.
  - name: framework
    values:
    - react
    - vue
    - express
    description: Primary framework or stack to use.
  - name: safe
    type: boolean
    description: Use conservative implementation with extra validation.
  - name: with-tests
    type: boolean
    description: Include or update tests as part of the implementation.
  examples:
  - /sc-implement "user profile component" --type component --framework react
  - /sc-implement "user authentication API" --type api --safe --with-tests
workflow:
- analyze_requirements
- detect_technology_context
- plan_implementation
- activate_relevant_personas
- generate_code
- write_tests
- validate_security
- validate_quality
personas:
- architect
- frontend-architect
- backend-architect
- security-engineer
- quality-engineer
mcp:
  optional:
  - context7
  - sequential-thinking
safety:
  writes_code: true
  writes_files: true
  requires_user_confirmation_for_scope_change: true
output_contract:
  primary: implementation
  required_sections:
  - implementation_plan
  - code_changes
  - tests
  - validation_summary
codex:
  skill_name: superclaude-implement
  default_reasoning: high
  web_search: optional
