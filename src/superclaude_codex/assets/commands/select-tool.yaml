schema_version: 1
id: select-tool
display_name: /sc-select-tool
category: utility
description: Intelligent MCP tool selection based on complexity scoring and operation analysis
aliases:
- /sc-select-tool
- /sc:select-tool
- sc-select-tool
- sc:select-tool
- select-tool
triggers:
- Operations requiring optimal MCP tool selection between Serena and Morphllm
- Meta-system decisions needing complexity analysis and capability matching
- Tool routing decisions requiring performance vs accuracy trade-offs
- Operations benefiting from intelligent tool capability assessment
workflow:
- parse
- score
- match
- select
- validate
personas: []
mcp: {}
safety:
  writes_code: false
  writes_files: false
  requires_user_confirmation_for_scope_change: false
output_contract:
  primary: tool_selection
  required_sections:
  - recommended_tool
  - rationale
codex:
  skill_name: superclaude-select-tool
  default_reasoning: medium
  web_search: optional
inputs:
  positional:
  - name: operation
    required: false
    description: Operation or edit scenario to choose tools for.
  flags:
  - name: analyze
    type: boolean
    description: Analyze the operation before recommending tools.
  - name: explain
    type: boolean
    description: Explain why the selected tools fit the task.
  examples:
  - /sc-select-tool "rename function across 10 files" --analyze
