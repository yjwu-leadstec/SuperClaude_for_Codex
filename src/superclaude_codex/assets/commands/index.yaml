schema_version: 1
id: index
display_name: /sc-index
category: utility
description: Generate comprehensive project documentation and knowledge base with intelligent
  organization
aliases:
- /sc-index
- /sc:index
- sc-index
- sc:index
- index
triggers:
- Project documentation creation and maintenance requirements
- Knowledge base generation and organization needs
- API documentation and structure analysis requirements
- Cross-referencing and navigation enhancement requests
workflow:
- analyze
- organize
- generate
- validate
- maintain
personas:
- system-architect
- scribe
- quality-engineer
mcp:
  optional:
  - sequential-thinking
  - context7
safety:
  writes_code: false
  writes_files: true
  requires_user_confirmation_for_scope_change: true
output_contract:
  primary: index
  required_sections:
  - structure
  - summary
codex:
  skill_name: superclaude-index
  default_reasoning: medium
  web_search: optional
inputs:
  positional:
  - name: target
    required: false
    description: Project path, source directory, API, or documentation area to index.
  flags:
  - name: type
    values:
    - docs
    - api
    - structure
    - readme
    description: Index type.
  - name: format
    values:
    - md
    - json
    - yaml
    description: Index output format.
  examples:
  - /sc-index project-root --type structure --format md
  - /sc-index src/api --type api --format json
