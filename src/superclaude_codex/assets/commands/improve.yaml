schema_version: 1
id: improve
display_name: /sc-improve
category: development
description: Apply systematic improvements to code quality, performance, and maintainability
aliases:
- /sc-improve
- /sc:improve
- sc-improve
- sc:improve
- improve
triggers:
- Code quality enhancement and refactoring requests
- Performance optimization and bottleneck resolution needs
- Maintainability improvements and technical debt reduction
- Best practices application and coding standards enforcement
workflow:
- analyze
- plan
- execute
- validate
- document
personas:
- system-architect
- performance
- quality-engineer
- security
mcp:
  optional:
  - sequential-thinking
  - context7
safety:
  writes_code: true
  writes_files: true
  requires_user_confirmation_for_scope_change: true
output_contract:
  primary: improvement_report
  required_sections:
  - changes_made
  - before_after
  - metrics
codex:
  skill_name: superclaude-improve
  default_reasoning: medium
  web_search: optional
inputs:
  positional:
  - name: target
    required: false
    description: Code, module, API, or project area to improve.
  flags:
  - name: type
    values:
    - quality
    - performance
    - maintainability
    - style
    - security
    description: Improvement category.
  - name: safe
    type: boolean
    description: Use conservative improvement with validation gates.
  - name: interactive
    type: boolean
    description: Ask before applying higher-impact improvements.
  - name: preview
    type: boolean
    description: Show proposed improvements without applying changes.
  examples:
  - /sc-improve src/ --type quality --safe
  - /sc-improve api-endpoints --type performance --interactive
